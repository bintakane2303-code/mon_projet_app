name: mon_projet_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Dépendances pour Supabase et les variables d'environnement
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  # Déclaration des ressources de l'application
  assets:
    - assets/aviva_logo.png
    # Déclaration du fichier .env pour charger les clés Supabase & Google
    - .env